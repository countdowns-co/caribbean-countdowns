name: Deploy CC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull data from R2
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync s3://caribbean-data/ src/data/ \
            --endpoint-url https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --quiet

      - name: Validate JSON files
        if: github.event_name != 'pull_request'
        run: |
          for f in src/data/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "✓ $f" || { echo "✗ Invalid JSON: $f"; exit 1; }
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      - name: Type check
        if: github.event_name != 'pull_request'
        run: npm run check

      - name: Lint
        run: npm run lint

      - run: npm audit --audit-level=high --omit=dev

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Purge only this site's hostname (the zone also serves api./pro./hub. subdomains),
      # so a changed static asset is not served stale from the edge cache until max-age.
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Diagnostic (temporary): lengths and Cloudflare's own verify answers, never the secret itself.
          echo "token length: ${#CF_API_TOKEN} (user tokens ~40, account tokens ~53); zone id length: ${#CF_ZONE_ID} (expected 32)"
          case "$CF_API_TOKEN" in *[[:space:]]*) echo "token contains whitespace";; esac
          case "$CF_ZONE_ID" in *[[:space:]]*) echo "zone id contains whitespace";; esac
          echo "user-token verify:"
          curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer ${CF_API_TOKEN}" || true; echo
          echo "account-token verify:"
          curl -sS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/tokens/verify" -H "Authorization: Bearer ${CF_API_TOKEN}" || true; echo
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["caribbean.countdowns.co"]}'
