name = "suggest"
main = "index.js"
compatibility_date = "2025-01-01"
workers_dev = false

[[r2_buckets]]
binding = "CARIBBEAN_DATA"
bucket_name = "caribbean-data"

[[routes]]
pattern = "caribbean.countdowns.co/api/suggest*"
zone_name = "countdowns.co"

# 3 submissions per minute per IP — stricter than visits (30/60s, id 1002)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 3, period = 60 }
